<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search the Mecchai</title>
  <link rel="icon" href="/icon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="center-screen">
    <div class="card">
      <h1>🔍 Search the Mecchai</h1>
      <p class="subtitle">Enter your nickname, pick a level, and find the hidden objects as fast as you can!</p>

      <form id="startForm">
        <label for="nickname">Your nickname</label>
        <input type="text" id="nickname" maxlength="30" placeholder="e.g. EagleEye" autocomplete="off" required />
        <button type="submit" class="btn-block" id="startBtn">Continue →</button>
        <div id="msg" class="msg"></div>
      </form>

      <div class="divider"></div>
      <div class="row space">
        <a class="hint" href="/submit.html">Create your own level</a>
        <a class="hint" href="/admin.html">Admin</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('startForm');
    const nickInput = document.getElementById('nickname');
    const msg = document.getElementById('msg');
    nickInput.value = localStorage.getItem('nickname') || '';

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const nick = nickInput.value.trim();
      if (!nick) {
        msg.textContent = 'Please enter a nickname.';
        msg.className = 'msg error';
        return;
      }
      localStorage.setItem('nickname', nick);
      window.location.href = '/browse.html';
    });
  </script>
</body>
</html>
